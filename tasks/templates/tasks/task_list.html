<!DOCTYPE html>
<html>
<head>
    <title>To-Do App</title>
</head>
<body>
    <h1>My Tasks</h1>

<form method="POST">
    {% csrf_token %}
    <input type="text" name="title" placeholder="Enter task..." required>
    
    <!-- 📅 Date Input -->
    <input type="date" name="due_date">
    
    <button type="submit">Add</button>
</form>

<hr>

<ul>
    {% for task in tasks %}
        <li>
            <!-- ✅ Checkbox -->
            <input type="checkbox" 
                   {% if task.completed %}checked{% endif %}
                   onclick="toggleTask({{ task.id }})">

            <span style="{% if task.completed %}text-decoration: line-through;{% endif %}">
                {{ task.title }}
            </span>

            <!-- 📅 Show Date -->
            {% if task.due_date %}
                (Due: {{ task.due_date }})
            {% endif %}

            <a href="{% url 'update_task' task.id %}">Edit</a>
            <a href="{% url 'delete_task' task.id %}">Delete</a>
        </li>
    {% endfor %}
</ul>
<a href="{% url 'task_history' %}">View Completed Tasks</a>
<br>
<a href="{% url 'tasks_by_date' %}">Search by Date</a>
<script>
function toggleTask(taskId) {
    fetch(`/toggle/${taskId}/`)
    .then(response => response.json())
    .then(data => {
        location.reload();  // simple refresh
    });
}
</script>
</body>
</html>
